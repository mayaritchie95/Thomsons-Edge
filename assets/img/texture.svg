<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.016" numOctaves="4" seed="7" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.62
                0 0 0 0 0.53
                0 0 0 0 0.40
                0 0 0 0.9 0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" intercept="0"/>
      </feComponentTransfer>
    </filter>
    <filter id="clouds" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.006" numOctaves="3" seed="21" stitchTiles="stitch" result="c"/>
      <feColorMatrix in="c" type="matrix"
        values="0 0 0 0 0.70
                0 0 0 0 0.61
                0 0 0 0 0.47
                0 0 0 0.6 0"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="#F3EEE6"/>
  <rect width="1200" height="1200" filter="url(#clouds)" opacity="0.5"/>
  <rect width="1200" height="1200" filter="url(#paper)" opacity="0.35"/>
</svg>
